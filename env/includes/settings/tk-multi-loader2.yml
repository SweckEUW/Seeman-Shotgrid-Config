includes:
  - ../app_locations.yml

################################################################################

# houdini
settings.tk-multi-loader2.houdini:
  actions_hook: "{config}/tk-multi-loader2/tk-houdini_actions.py"
  action_mappings:
    USD Asset: [reference]
  entities:
    - caption: Assets
      entity_type: Asset
      filters:
        - [project, is, "{context.project}"]
      hierarchy: [sg_asset_type, code]
    - caption: Shots
      entity_type: Shot
      filters:
        - [project, is, "{context.project}"]
      hierarchy: [sg_sequence, code]
  publish_filters: [["sg_status_list", "is_not", null]]
  location: "@apps.tk-multi-loader2.location"

# maya
settings.tk-multi-loader2.maya:
  actions_hook: "{config}/tk-multi-loader2/tk-maya_actions.py"
  action_mappings:
    USD Asset: [reference]
    Maya Scene: [reference]
  entities:
    - caption: Assets
      entity_type: Asset
      filters:
        - [project, is, "{context.project}"]
      hierarchy: [sg_asset_type, code]
    - caption: Shots
      entity_type: Shot
      filters:
        - [project, is, "{context.project}"]
      hierarchy: [sg_sequence, code]
  publish_filters: [["sg_status_list", "is_not", null]]
  location: "@apps.tk-multi-loader2.location"

# nuke
settings.tk-multi-loader2.nuke:
  action_mappings:
    Alembic Cache: [read_node]
    Flame Render: [read_node]
    Flame Quicktime: [read_node]
    Image: [read_node]
    Movie: [read_node]
    Nuke Script: [script_import]
    Photoshop Image: [read_node]
    Rendered Image: [read_node]
    Texture: [read_node]
  entities:
  - caption: Assets
    entity_type: Asset
    filters:
    - [project, is, '{context.project}']
    hierarchy: [sg_asset_type, code]
  - caption: Assets - Linked
    entity_type: Asset
    filters:
    - [ linked_projects, is, "{context.project}" ]
    hierarchy: [ project.Project.name, sg_asset_type, code ]
  - caption: Shots
    entity_type: Shot
    filters:
    - [project, is, '{context.project}']
    hierarchy: [sg_sequence, code]
  publish_filters: [["sg_status_list", "is_not", null]]
  location: "@apps.tk-multi-loader2.location"

