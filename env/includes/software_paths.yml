# Software path configuration. Typically consumed by the launchapp
# configurations for software that is not auto-discovered

################################################################################


# Maya
path.linux.maya: "/usr/autodesk/maya{version}/bin/maya{version}"
path.mac.maya: ""
path.windows.maya: C:\Program Files\Autodesk\Maya{version}\bin\maya.exe

# Nuke
path.linux.nuke: "Nuke{version}"
path.mac.nuke: ""
path.windows.nuke: C:\Program Files\Nuke15.1v5\Nuke15.1.exe

# Houdini
path.linux.houdini: /opt/hfs{version}/bin/houdinifx
path.mac.houdini: ""
path.windows.houdini: C:\Program Files\Side Effects Software\Houdini {version}\bin\houdinifx.exe