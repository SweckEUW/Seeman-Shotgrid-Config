keys:
  # Maya supports two extension types.
  maya_extension:
    type: str
    choices:
      mb: Maya Binary (.mb)
    default: mb
    alias: extension

paths:
  ##########################################################################################
  # Shot level paths
  #

  # The location of WIP files
  maya_shot_work:
    definition: "@shot_root/{Sequence}_{Shot}_{Step}_{name}_v{version}.{maya_extension}"
  # The location of backups of WIP files
  maya_shot_snapshot:
    definition: "@shot_root/snapshots/{Sequence}_{Shot}_{Step}_snap_{name}_v{version}_{timestamp}.{maya_extension}"
  # The location of published maya files
  maya_shot_publish:
    definition: "@shot_publish/{Sequence}_{Shot}_{Step}_pub_{name}_v{version}.{maya_extension}"

  ##########################################################################################
  # Asset pipeline
  #

  # The location of WIP files
  maya_asset_work:
    definition: "@asset_root/{Asset}_{Step}_{name}_v{version}.{maya_extension}"
  # The location of backups of WIP files
  maya_asset_snapshot:
    definition: "@asset_root/snapshots/{Asset}_{Step}_{name}_snap_v{version}_{timestamp}.{maya_extension}"
  # The location of published maya files
  maya_asset_publish:
    definition: "@asset_publish/{Asset}_{Step}_{name}_pub_v{version}.{maya_extension}"